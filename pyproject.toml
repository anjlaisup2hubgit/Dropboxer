[project]
name = "phototransfer"
version = "0.1.0"
description = "Copy photos and videos from an iPhone to Windows over USB"
requires-python = ">=3.10"
dependencies = ["pymobiledevice3", "pillow", "pillow-heif", "segno"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
phototransfer = "phototransfer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phototransfer", "phototransfer.sources"]
